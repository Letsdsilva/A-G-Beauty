<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>A&G Beauty | ADM</title><link rel="stylesheet" href="portal.css"></head><body><div class="app"><header class="topbar"><div class="topbrand"><div class="brand-mini">A<span>&</span>G</div><span>PAINEL ADM</span></div><div class="top-actions"><a class="ghost" href="index.html">Ver site</a><button class="ghost" onclick="logout()">Sair</button></div></header><main class="dashboard">

<section class="panel"><div class="panel-head"><div><span class="eyebrow">EQUIPE</span><h2>Profissionais</h2></div></div><div id="professionals" class="people"></div></section>
